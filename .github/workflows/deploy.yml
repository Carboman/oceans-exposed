name: Deploy site

# Deploys the Worker and static pages when code changes on main.
# Requires the repo secret CLOUDFLARE_API_TOKEN (account_id is in wrangler.jsonc); skipped until it exists.
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tests/**', 'wrangler.jsonc', 'package.json', 'package-lock.json']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Site checks and tests
        run: |
          node tools/site-check.mjs
          node --test tests/*.test.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy
