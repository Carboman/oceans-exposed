name: Bootstrap site

# One-off launch of earth.exposed, run by hand (Actions > Bootstrap site > Run workflow). Safe to re-run.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template + Zone DNS Edit + Zone Read,
# scoped to the earth.exposed zone). No R2, no publish token: the hub has no storage.
#   1. Runs the checks and tests.
#   2. Refreshes the snapshot from the live sites and commits it.
#   3. Deploys the Worker, the pages and the earth.exposed custom domain.
#   4. Waits for https://earth.exposed to answer.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check the secret
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set (Settings > Secrets and variables > Actions)."; exit 1; }
          npx wrangler whoami | sed -n '1,12p'

      - name: Refresh the snapshot from the live sites
        run: node tools/refresh.mjs

      - name: Site checks and tests
        run: |
          node tools/chrome.mjs --check
          node tools/site-check.mjs
          node --test tests/*.test.mjs

      - name: Commit the snapshot
        run: |
          git config user.name 'earth-exposed-bot'
          git config user.email 'earth-exposed-bot@users.noreply.github.com'
          git add public/data
          git diff --cached --quiet || { git commit -m "Network refresh $(date -u +%F) (bootstrap)"; git push origin HEAD:main; }

      - name: Deploy
        run: npx wrangler deploy

      - name: Wait for the custom domain
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://earth.exposed/api/network/sites.json || true)
            if [ "$code" = "200" ]; then echo "earth.exposed answers ($code)."; exit 0; fi
            echo "attempt $i: $code"; sleep 15
          done
          echo "::warning::https://earth.exposed did not answer within 10 minutes; DNS may still be propagating. Re-run later."

      - name: Live check
        if: always()
        run: |
          echo "## Bootstrap" >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '```json'; curl -s --max-time 20 https://earth.exposed/api/network/sites.json | head -c 1500 || echo '{"error":"no answer"}'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
